name: Vérifier le Worker réellement publié
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-production-atelier
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérifier le commit Cloudflare et la confidentialité des routes
        run: node scripts/production-smoke.mjs
