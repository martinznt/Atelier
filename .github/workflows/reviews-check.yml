name: Validation de la chaîne de revues
on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "tests/review-core.test.mjs"
      - "migrations/**"
      - "package.json"
      - ".github/workflows/reviews-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Contrats de relecture
        run: node --test tests/review-core.test.mjs
      - name: Typescript
        run: npm run check
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
